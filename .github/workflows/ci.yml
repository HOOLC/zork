name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/agent*/**"
      - "crates/profile/**"
      - "crates/slack/**"
      - "crates/station/**"
      - "crates/zork/**"
      - "crates/zork-android/**"
      - "crates/zork-browser/**"
      - "crates/zork-client-core/**"
      - "crates/zork-client-types/**"
      - "crates/zork-config/**"
      - "crates/zork-gh/**"
      - "crates/zork-mesh/**"
      - "crates/zork-notify/**"
      - "crates/zork-observe/**"
      - "vendor/synch*/**"
      - "vendor/rustls*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "scripts/check-runtime.sh"
      - "scripts/lib/build_env.py"
      - "scripts/test-mesh.py"
      - "scripts/test-skills.py"
      - "scripts/test-slack-forwarding.py"
      - "scripts/test-sync-idle.py"
      - "crates/zork-gui/tests/test_station_entry.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: Main runtime contracts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      KACHE_CONFIGURED: ${{ vars.KACHE_S3_ENDPOINT != '' && secrets.KACHE_S3_ACCESS_KEY != '' && secrets.KACHE_S3_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore runtime target cache
        id: target
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ci-target-v5-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-target-v5-runtime-${{ runner.os }}-${{ runner.arch }}-
            ci-target-v4-station-${{ runner.os }}-${{ runner.arch }}-
            ci-target-v2-frontend-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up kache build cache
        if: env.KACHE_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          # Publish namespaced shards explicitly after compilation; avoid the
          # duplicate manifest and full remote sync in the action's post step.
          save-cache: false
          manifest-key: zork-main-runtime-${{ runner.os }}-${{ runner.arch }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'zork-kache' }}
          s3-region: auto
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared runtime and test binaries
        run: bash scripts/check-runtime.sh build
      - name: Record compiled dependencies
        if: env.KACHE_CONFIGURED == 'true'
        env:
          KACHE_REMOTE_READONLY: "0"
        run: kache save-manifest --manifest-key "$KACHE_MANIFEST_KEY" --namespace "$KACHE_NAMESPACE"
      - name: Save compiled target cache
        if: steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: ${{ steps.target.outputs.cache-primary-key }}
      - name: Test runtime contracts
        run: bash scripts/check-runtime.sh test
