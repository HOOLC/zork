name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Main branch static checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: |
          pnpm format:check
          cargo fmt --all -- --check
          pnpm lint
      - name: Check client boundaries
        run: |
          python3 scripts/check-client-boundary.py --self-test
          python3 scripts/check-client-boundary.py
      - name: Check design workspace
        run: |
          pnpm design:check
          pnpm design:test

  frontend:
    name: Runtime E2E and integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      KACHE_CONFIGURED: ${{ vars.KACHE_S3_ENDPOINT != '' && secrets.KACHE_S3_ACCESS_KEY != '' && secrets.KACHE_S3_SECRET_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore CI target cache
        uses: actions/cache@v4
        with:
          path: target
          key: ci-target-v2-frontend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-target-v2-frontend-${{ runner.os }}-${{ runner.arch }}-
            ci-target-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up kache build cache
        if: env.KACHE_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'zork-kache' }}
          s3-region: auto
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime test binaries
        run: |
          python3 scripts/lib/build_env.py -- cargo build --locked -p zork -p zork-station -p zork-gh

      - name: Run tests
        run: pnpm test

      - name: Test core-owned desktop operations
        if: github.ref == 'refs/heads/main'
        run: cargo test --locked -p zork-client-core --features desktop --lib --test client_boundary

      - name: Test Slack forwarding and bundled skills
        run: |
          python3 scripts/test-slack-forwarding.py
          python3 scripts/test-skills.py

      - name: Test Gateway sync reaches idle
        run: python3 scripts/test-sync-idle.py

      - name: Run desktop entry contract
        run: python3 crates/zork-gui/tests/test_gateway_entry.py

  backend:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      KACHE_CONFIGURED: ${{ vars.KACHE_S3_ENDPOINT != '' && secrets.KACHE_S3_ACCESS_KEY != '' && secrets.KACHE_S3_SECRET_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore CI target cache
        uses: actions/cache@v4
        with:
          path: target
          key: ci-target-v2-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-target-v2-backend-${{ runner.os }}-${{ runner.arch }}-
            ci-target-v2-frontend-${{ runner.os }}-${{ runner.arch }}-
            ci-target-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up kache build cache
        if: env.KACHE_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'zork-kache' }}
          s3-region: auto
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}

      - name: Run backend tests
        run: |
          python3 scripts/lib/build_env.py -- cargo test --locked --workspace --exclude zork-gui --exclude zork-browser-runtime --lib --tests --no-fail-fast
