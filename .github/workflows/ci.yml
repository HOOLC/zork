name: CI

on:
  push:
    branches: [main]
    paths:
      - "crates/agent*/**"
      - "crates/profile/**"
      - "crates/slack/**"
      - "crates/station/**"
      - "crates/zork/**"
      - "crates/zork-android/**"
      - "crates/zork-browser/**"
      - "crates/zork-client-core/**"
      - "crates/zork-client-types/**"
      - "crates/zork-config/**"
      - "crates/zork-gh/**"
      - "crates/zork-mesh/**"
      - "crates/zork-notify/**"
      - "crates/zork-observe/**"
      - "vendor/synch*/**"
      - "vendor/rustls*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "scripts/check-runtime.sh"
      - "scripts/lib/build_env.py"
      - "scripts/test-mesh.py"
      - "scripts/test-skills.py"
      - "scripts/test-slack-forwarding.py"
      - "scripts/test-sync-idle.py"
      - "crates/zork-gui/tests/test_station_entry.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      prime_cache:
        description: Build and publish the runtime cache only; does not run tests
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.prime_cache && 'prime' || 'verify' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ inputs.prime_cache && 'Prime runtime cache (no tests)' || 'Main runtime contracts' }}
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.prime_cache)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.prime_cache && 15 || 5 }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      KACHE_CONFIGURED: ${{ vars.KACHE_S3_ENDPOINT != '' && secrets.KACHE_S3_ACCESS_KEY != '' && secrets.KACHE_S3_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore runtime target cache
        id: target
        uses: actions/cache/restore@v4
        with:
          path: target
          key: ci-target-v5-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-target-v5-runtime-${{ runner.os }}-${{ runner.arch }}-
            ci-target-v4-station-${{ runner.os }}-${{ runner.arch }}-
            ci-target-v2-frontend-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up kache build cache
        if: env.KACHE_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          # Cache linked test/program artifacts as well as libraries. Let the
          # action own uploads and its single manifest publication.
          version: "0.26.0"
          save-cache: true
          cache-executables: true
          pr-comment: false
          manifest-key: zork-main-runtime-${{ runner.os }}-${{ runner.arch }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'zork-kache' }}
          s3-region: auto
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared runtime and test binaries
        run: bash scripts/check-runtime.sh build
      - name: Save compiled target cache
        if: env.KACHE_CONFIGURED != 'true' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: ${{ steps.target.outputs.cache-primary-key }}
      - name: Test runtime contracts
        if: ${{ !inputs.prime_cache }}
        run: bash scripts/check-runtime.sh test
