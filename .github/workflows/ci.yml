name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      KACHE_CONFIGURED: ${{ vars.KACHE_S3_ENDPOINT != '' && secrets.KACHE_S3_ACCESS_KEY != '' && secrets.KACHE_S3_SECRET_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore CI target cache
        uses: actions/cache@v4
        with:
          path: target
          key: ci-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Set up kache build cache
        if: env.KACHE_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'zork-kache' }}
          s3-region: auto
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: |
          pnpm format:check
          cargo fmt --all -- --check

      - name: Check client core and UI boundaries
        run: |
          python3 scripts/check-client-boundary.py --self-test
          python3 scripts/check-client-boundary.py

      - name: Lint
        run: pnpm lint

      - name: Check design workspace
        run: |
          pnpm design:check
          pnpm design:test
          pnpm design:build

      - name: Run tests
        run: pnpm test

      - name: Run backend tests
        run: pnpm test:rust --no-fail-fast

      - name: Test core-owned desktop operations
        run: cargo test --locked -p zork-client-core --features desktop --lib --test client_boundary

      - name: Test Slack forwarding and bundled skills
        run: |
          python3 scripts/test-slack-forwarding.py
          python3 scripts/test-skills.py

      - name: Test Gateway sync reaches idle
        run: python3 scripts/test-sync-idle.py

      - name: Test invitation and browser notifications
        run: |
          cargo build --locked -p zork-client-core --example invitation-observer
          python3 scripts/test-mesh-notifications.py

      - name: Run desktop entry contract
        run: python3 crates/zork-gui/tests/test_gateway_entry.py

      - name: Test native installer and release assembly
        run: python3 scripts/test-native-installer.py

      - name: Test native Gateway upgrades
        run: |
          python3 scripts/test-native-upgrade.py
          python3 scripts/test-gateway-upgrade.py
