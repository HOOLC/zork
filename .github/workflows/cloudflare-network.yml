name: Cloudflare network

on:
  push:
    branches: [main]
    paths:
      - deploy/cloudflare/**
      - .github/workflows/cloudflare-network.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: deploy/cloudflare/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check Worker bundle without rebuilding the relay image
        run: pnpm exec wrangler deploy --dry-run --containers-rollout none
