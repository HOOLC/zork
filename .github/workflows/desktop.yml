name: Desktop

on:
  pull_request:
    paths:
      - "crates/zork-gui/src/**"
      - "crates/zork-gui/tests/*.rs"
      - "crates/zork-gui/assets/**"
      - "crates/zork-gui/Cargo.toml"
      - "crates/zork-config/**"
      - "crates/zork-ui/**"
      - "vendor/gpui-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "crates/zork-gui/src/**"
      - "crates/zork-gui/tests/*.rs"
      - "crates/zork-gui/assets/**"
      - "crates/zork-gui/Cargo.toml"
      - "crates/zork-config/**"
      - "crates/zork-ui/**"
      - "vendor/gpui-*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Native desktop tests
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      KACHE_CONFIGURED: ${{ vars.KACHE_S3_ENDPOINT != '' && secrets.KACHE_S3_ACCESS_KEY != '' && secrets.KACHE_S3_SECRET_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Metal shader compiler
        run: |
          if ! xcrun --sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun --sdk macosx metal --version
          xcrun --sdk macosx --find metallib
      - name: Set up kache build cache
        if: env.KACHE_CONFIGURED == 'true'
        uses: kunobi-ninja/kache-action@v1
        with:
          s3-bucket: ${{ vars.KACHE_S3_BUCKET || 'zork-kache' }}
          s3-region: auto
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-access-key-id: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-access-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
      - run: cargo test --locked -p zork-gui
