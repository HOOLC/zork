[package]
name = "synch-engine"
description = "The embeddable synchronicity node: sources, publisher, anti-entropy, fetcher, replicas, checkouts"
version = "0.1.8"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeynepbabur/synchronicity"
authors = ["the synchronicity authors"]

[dependencies]
aws-lc-rs = { "version" = "1.18.0", "features" = ["ring-io"] }
directories = "6.0.0"
fs2 = "0.4.3"
futures-util = { "version" = "0.3.31", "default-features" = false, "features" = ["alloc"] }
hex = "0.4.3"
iroh = { "version" = "1.0.3", "default-features" = false, "features" = ["tls-aws-lc-rs", "platform-verifier"] }
iroh-base = { "version" = "1.0.3", "default-features" = false, "features" = ["key"] }
notify = "8.2.0"
postcard = { "version" = "1.1.3", "default-features" = false, "features" = ["use-std"] }
serde = { "version" = "1.0.229", "features" = ["derive"] }
serde_json = "1.0.145"
synch-core = { "git" = "https://github.com/AFK-surf/synchronicity.git", "rev" = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-mpt = { "git" = "https://github.com/AFK-surf/synchronicity.git", "rev" = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-net = { "git" = "https://github.com/AFK-surf/synchronicity.git", "rev" = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-sock = { "git" = "https://github.com/AFK-surf/synchronicity.git", "rev" = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }

async-trait = "0.1.89"
synch-store = { "git" = "https://github.com/AFK-surf/synchronicity.git", "rev" = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
thiserror = "2.0.20"
tokio = { "version" = "1.53.1", "features" = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process", "signal"] }
# The cloud-attach tunnel: an outbound WebSocket client, TLS through rustls.
# No server half is pulled in — the daemon dials out and never listens.
tokio-tungstenite = { "version" = "0.30.0", "default-features" = false, "features" = ["connect", "handshake", "rustls-tls-native-roots"] }
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
rustix = { "version" = "1.1.4", "features" = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# The simulated zone/log harness, for tests only.
synch-cc = { "git" = "https://github.com/AFK-surf/synchronicity.git", "rev" = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-net = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d", features = ["sim"] }
iroh-base = { "version" = "1.0.3", "default-features" = false, "features" = ["key"] }
synch-store = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d", features = ["test-utils"] }
tempfile = "3.27.0"

[workspace]
