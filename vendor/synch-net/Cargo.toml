[package]
name = "synch-net"
description = "iroh endpoint, mptsync and blob ALPN handlers, and the DNSSEC membership resolver"
version = "0.1.8"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeynepbabur/synchronicity"
authors = ["the synchronicity authors"]

[features]
# The simulated signed zone, transparency log and TUF repository
# (`crate::sim`). Test machinery: 1300 lines of harness that has no place in
# a shipped binary and no business being part of this crate's public API.
# Enabled below as a dev-dependency on this same crate, which is how an
# integration test in another crate reaches it without every `synch` and
# `synch-s3` build carrying it. `sim` is what marks a test build, so it also
# carries the pre-main TLS provider install test binaries need
# (`crate::tls`).
sim = []

[dependencies]
aws-lc-rs = { version = "1.18.0", features = ["ring-io"] }
base64 = "0.22.1"
ctor = "0.4"
futures-core = "0.3"
hex = "0.4.3"
hickory-resolver = { version = "0.26.1", default-features = false, features = ["dnssec-aws-lc-rs", "tokio"] }
iroh = { version = "1.0.3", default-features = false, features = ["tls-aws-lc-rs", "platform-verifier", "unstable-net-report"] }
iroh-relay = { version = "1.0.3", default-features = false }
reqwest = { version = "0.13.4", features = ["rustls-no-provider", "stream", "blocking"], default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
rustls-platform-verifier = "0.7.0"
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
iroh-mainline-address-lookup = "0.5.0"
n0-mainline = "0.6.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
synch-core = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-mpt = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-store = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-sock = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }

async-trait = "0.1.89"
thiserror = "2.0.20"
time = "0.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process", "signal"] }
url = "2.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# This crate's own tests need the harness; production builds do not.
synch-net = { path = ".", features = ["sim"] }
hex = "0.4.3"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
time = "0.3"
synch-mpt = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "process", "signal", "test-util"] }
