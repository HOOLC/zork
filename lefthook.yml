pre-commit:
  parallel: true
  commands:
    js-check:
      run: vp staged
    format-check:
      glob:
        - "*.{json,jsonc,toml,md,yml,yaml}"
        - "**/*.{json,jsonc,toml,md,yml,yaml}"
      run: vp fmt --check --no-error-on-unmatched-pattern {staged_files}
    rust-format:
      glob:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "{Cargo.toml,Cargo.lock,rustfmt.toml}"
      run: cargo fmt --all -- --check
    client-boundary:
      glob:
        - "{crates/zork-client-core,crates/zork-ui,crates/zork-gui}/*"
        - "{crates/zork-client-core,crates/zork-ui,crates/zork-gui}/**/*"
        - "apps/android/app/src/main/java/**/*.kt"
        - "scripts/check-client-boundary.py"
        - "Cargo.toml"
      run: python3 scripts/check-client-boundary.py --self-test && python3 scripts/check-client-boundary.py
    hook-config:
      glob: "lefthook.yml"
      run: pnpm exec lefthook validate

pre-push:
  parallel: false
  commands:
    static-checks:
      glob:
        - "*.{js,ts,tsx,mjs,json,jsonc,toml,yml,yaml}"
        - "**/*.{js,ts,tsx,mjs,json,jsonc,toml,yml,yaml}"
      run: pnpm format:check && pnpm lint
    runtime-tests:
      glob:
        - "crates/{agent*,profile,slack,station,zork,zork-android,zork-browser,zork-client-core,zork-client-types,zork-config,zork-gh,zork-mesh,zork-notify,zork-observe}/**"
        - "vendor/{rustls*,iroh,swarm-discovery,noq-udp}/**"
        - "{Cargo.toml,Cargo.lock,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,vite.config.ts,lefthook.yml}"
        - "{packages,test}/**"
        - "scripts/{check-runtime.sh,test-build-env.py,test-ci-source-stamps.py,test-mesh.py,test-slack-forwarding.py,test-sync-idle.py}"
        - "scripts/lib/{build_env,ci_source_stamps}.py"
        - "crates/zork-gui/tests/test_station_entry.py"
        - ".github/workflows/ci.yml"
      run: bash scripts/check-runtime.sh
    desktop-tests:
      glob:
        - "crates/{agent-api,zork-gui,zork-ui,zork-client-core,zork-client-types,zork-config,zork-mesh,zork-notify,zork-observe,zork-browser,zork-browser-runtime}/**"
        - "vendor/**"
        - "{Cargo.toml,Cargo.lock,lefthook.yml}"
        - "scripts/lib/build_env.py"
      skip:
        - run: test "$(uname -s)" != Darwin
      run: >-
        CARGO_INCREMENTAL=${CARGO_INCREMENTAL:-0} CARGO_PROFILE_DEV_DEBUG=${CARGO_PROFILE_DEV_DEBUG:-0}
        CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-4}
        python3 scripts/lib/build_env.py -- cargo test --locked -p zork-gui -p zork-ui --lib --tests
    cua-packaging:
      glob:
        - "scripts/{build-cua-driver.py,package-macos-client.py,test-cua-build.py,test-cua-packaging.py}"
        - "scripts/build/macos-cua-host.m"
        - "scripts/lib/{cua-runtime.py,cua_build.py}"
        - "lefthook.yml"
      skip:
        - run: test "$(uname -s)" != Darwin
      run: python3 scripts/test-cua-build.py && python3 scripts/test-cua-packaging.py
    benchmark-adapters:
      glob:
        - "benchmarks/deep-swe/**"
        - "{package.json,lefthook.yml}"
      run: pnpm benchmark:deep-swe:test
    native-installer:
      glob:
        - "scripts/{build/native-release.py,install*.sh,test-native-installer.py,test-native-upgrade.py,test-station-upgrade.py,test-mesh-installer.py}"
        - "crates/{zork,zork-config,zork-mesh}/**"
        - "crates/station/src/{node.rs,enrollment.rs}"
        - "{Cargo.toml,Cargo.lock,package.json,lefthook.yml}"
        - ".github/workflows/release.yml"
        - "scripts/lib/{deployment*,install-macos-client.py,build_env.py,cua_build.py}"
        - "scripts/dev/recovery.py"
        - "scripts/{update-macos-client.py,package-macos-client.py,test-deployment-recovery.py,test-release-dev-recovery.py,test-macos-channel-recovery.py}"
      run: python3 -m py_compile scripts/build/native-release.py scripts/test-native-installer.py && python3 scripts/test-native-installer.py && python3 scripts/test-deployment-recovery.py
    cloudflare:
      glob:
        - "deploy/cloudflare/**"
        - ".github/workflows/cloudflare-network.yml"
        - "lefthook.yml"
      run: >-
        pnpm --dir deploy/cloudflare install --frozen-lockfile &&
        pnpm --dir deploy/cloudflare types && pnpm --dir deploy/cloudflare check &&
        pnpm --dir deploy/cloudflare test &&
        pnpm --dir deploy/cloudflare exec wrangler deploy --dry-run
