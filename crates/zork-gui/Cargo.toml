[package]
name = "zork-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zork-gui"
path = "src/main.rs"

[[bin]]
name = "zork-gui-render-bench"
path = "src/bin/render-bench.rs"
required-features = ["headless-bench"]

[[bin]]
name = "zork-design-pc"
path = "src/bin/design_pc.rs"
required-features = ["headless-bench"]

[[test]]
name = "headless_selection"
path = "tests/headless_selection.rs"
harness = false
required-features = ["headless-bench"]

[[test]]
name = "headless_modals"
path = "tests/headless_modals.rs"
harness = false
# The modal fixtures drive frames synchronously through `present_if_needed`,
# which the vendored gpui exposes under its `bench` feature.
required-features = ["headless-bench", "native-blur-bench"]

[[test]]
name = "headless_profile_quota"
path = "tests/headless_profile_quota.rs"
harness = false
required-features = ["headless-bench"]

[dependencies]
ulid.workspace = true
zork-client-core = { path = "../zork-client-core", features = ["desktop"] }
zork-ui = { path = "../zork-ui", features = ["native-screenshots"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
libc = "0.2"
gpui = { package = "gpui-unofficial", version = "1.17.0-pre" }
gpui-platform = { package = "gpui-platform-gpui-unofficial", version = "1.17.0-pre", features = [
  "font-kit",
  "test-support",
  "wayland",
  "x11",
] }
futures-util.workspace = true
futures-channel = "0.3.31"
tokio.workspace = true
serde.workspace = true
serde_json = "1.0.145"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
bytes = "1"
axum = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = { version = "3", optional = true }

[features]
native-blur-bench = ["headless-bench", "gpui/bench"]
frame-profiler = ["gpui/profiler", "zork-ui/frame-profiler"]
headless-bench = [
  "gpui/profiler",
  "gpui/test-support",
  "dep:tempfile",
  "zork-ui/headless-bench",
  "zork-ui/stories",
  "zork-client-core/headless-bench",
]

[dev-dependencies]
rusqlite.workspace = true
reqwest.workspace = true
zork-config = { path = "../zork-config" }
zork-mesh = { path = "../zork-mesh" }
tempfile = "3"


[[test]]
name = "headless_loading"
path = "tests/headless_loading.rs"
harness = false
required-features = ["headless-bench"]

[[test]]
name = "headless_isolation"
path = "tests/headless_isolation.rs"
