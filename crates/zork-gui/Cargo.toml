[target.'cfg(target_os = "macos")'.dependencies.gpui-apple]
package = "gpui-apple-gpui-unofficial"
version = "1.17.0-pre"

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "=0.3.2"
features = [
  "NSArray",
  "NSAttributedString",
  "NSBundle",
  "NSCoder",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSNull",
  "NSObjCRuntime",
  "NSObject",
  "NSProcessInfo",
  "NSRange",
  "NSRunLoop",
  "NSSet",
  "NSString",
  "NSURL",
  "NSUndoManager",
  "NSValue",
  "objc2-core-foundation",
  "std",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-user-notifications]
version = "0.3"

