[package]
name = "zork-client-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
markdown.workspace = true
ulid.workspace = true
zork-client-types = { path = "../zork-client-types" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-channel = "0.3.31"
futures-util.workspace = true
http = "1"
serde.workspace = true
serde_json = "1"
zork-observe = { path = "../zork-observe" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
base64 = "0.22"
getrandom.workspace = true
sha2 = "0.10.9"
zork-agent-api = { path = "../agent-api" }
bytes = "1"
reqwest.workspace = true
thiserror = "2.0.17"
tokio.workspace = true
rusqlite.workspace = true
zork-config = { path = "../zork-config" }
zork-mesh = { path = "../zork-mesh", default-features = false }
zork-notify = { path = "../zork-notify" }
imbl.workspace = true
zork-browser = { path = "../zork-browser", optional = true }
rquickjs = { version = "=0.13.0", optional = true, features = ["bindgen"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
libc = "0.2"

[features]
local-scripts = ["dep:rquickjs"]
headless-bench = []
desktop = ["dep:zork-browser"]

[[bench]]
name = "replica"
harness = false

[[bench]]
name = "messages"
harness = false

[[bench]]
name = "subscriptions"
harness = false
required-features = ["headless-bench"]

[[bench]]
name = "subscriptions_alloc"
harness = false
required-features = ["headless-bench"]

[[bench]]
name = "history"
harness = false
required-features = ["headless-bench"]
