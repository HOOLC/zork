[package]
name = "zork-agent-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.4"
serde_json = "1"
tokio.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zork-agent = { path = "../agent" }
zork-agent-http = { path = "../agent-http" }
zork-agent-station-tools = { path = "../agent-station-tools" }
zork-config = { path = "../zork-config" }

[[bin]]
name = "zork-agent"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
reqwest.workspace = true
libc = "0.2"
