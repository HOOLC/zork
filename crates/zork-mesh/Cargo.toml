[package]
name = "zork-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ulid.workspace = true
tempfile = "3"

anyhow = "1"
futures-util.workspace = true
fs2 = "0.4.3"
base64 = "0.22"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-aws-lc-rs", "platform-verifier"] }
swarm-discovery = "=0.6.3"
data-encoding = "2"
blake3 = "1.8"
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tracing = "0.1"
url = "2"
netdev = "=0.46.2"
zork-config = { path = "../zork-config" }
zork-notify = { path = "../zork-notify" }

iroh-relay = { version = "=1.1.0", default-features = false, features = ["server", "tls-aws-lc-rs"] }
rustls.workspace = true

[dev-dependencies]
iroh = { version = "=1.0.3", default-features = false, features = ["unstable-net-report"] }
rcgen = "=0.14.8"
