[package]
name = "zork-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["server"]
# Only hosts serving the Station bridge need the C-to-eBPF compiler.
server = ["dep:synch-cc", "dep:synch-sock"]

[[example]]
name = "mesh-lab"
required-features = ["server"]

[dependencies]
synch-mpt = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
ulid.workspace = true
synch-store = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
tempfile = "3"
synch-core = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-net = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-engine = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d" }
synch-cc = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d", optional = true }
synch-sock = { git = "https://github.com/AFK-surf/synchronicity.git", rev = "6d6283f09c32476dc77c09f76a2b2529a42a558d", optional = true }

anyhow = "1"
futures-util.workspace = true
fs2 = "0.4.3"
base64 = "0.22"
flate2 = "=1.1.9"
iroh = { version = "=1.0.3", default-features = false, features = ["tls-aws-lc-rs", "platform-verifier"] }
iroh-mdns-address-lookup = "=0.4.0"
blake3 = "1.8"
serde.workspace = true
serde_json = "1"
rusqlite.workspace = true
tokio.workspace = true
tracing = "0.1"
url = "2"
netdev = "=0.46.2"
zork-config = { path = "../zork-config" }
zork-notify = { path = "../zork-notify" }
