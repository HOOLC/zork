[package]
name = "zork-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zork-observe = { path = "../zork-observe" }
zork-liquid = { path = "../zork-liquid" }
qrcode = { version = "=0.14.1", default-features = false }
zork-client-types = { path = "../zork-client-types" }
gpui = { package = "gpui-unofficial", version = "=1.17.0-pre", default-features = false }
gpui-base = { package = "gpui-base-uo", version = "=1.17.0-pre" }
serde.workspace = true
serde_json = "1.0.145"
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
unicode-segmentation = "1.12"
rustc-hash = "=2.1.3"
lyon = "=1.0.19"
markdown.workspace = true
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"
js-sys = "0.3"

[features]
native-screenshots = ["gpui/test-support"]
stories = []
headless-bench = []
frame-profiler = ["gpui/profiler"]

[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
zork-client-core = { path = "../zork-client-core" }
gpui-platform = { package = "gpui-platform-gpui-unofficial", version = "=1.17.0-pre", features = ["font-kit", "test-support", "wayland", "x11"] }

[[test]]
name = "history_parity"
path = "tests/history_parity.rs"
harness = false
required-features = ["headless-bench", "stories"]
