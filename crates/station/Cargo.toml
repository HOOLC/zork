[package]
name = "zork-station"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zork-station"
path = "src/main.rs"

[features]
# Adds a business-operation probe only to explicitly built fake-model fixtures.

[dependencies]
anyhow = "1"
blake3 = "1"
jsonschema = { version = "0.49.7", default-features = false }
libc = "0.2"
cap-std = "=4.0.3"
axum = "0.8"
base64 = "0.22"
futures-util.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tokio-tungstenite.workspace = true
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid.workspace = true
zork-agent = { path = "../agent" }
zork-agent-http = { path = "../agent-http" }
zork-agent-gateway-tools = { path = "../agent-gateway-tools" }
zork-agent-api = { path = "../agent-api" }
zork-client-types = { path = "../zork-client-types" }
zork-config = { path = "../zork-config" }
zork-browser = { path = "../zork-browser" }
zork-profile = { path = "../profile" }
zork-mesh = { path = "../zork-mesh" }
zork-notify = { path = "../zork-notify" }
zork-slack = { path = "../slack" }

zork-client-core = { path = "../zork-client-core" }
zstd = "0.13.3"
