[package]
name = "zork-gui-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["headless-bench"]
# Enables fixture constructors in the shared production sources; no TestPlatform on web.
headless-bench = []
frame-profiler = []

[target.'cfg(target_family = "wasm")'.dependencies]
zork-client-core = { path = "../zork-client-core", features = ["headless-bench"] }
zork-ui = { path = "../zork-ui", features = ["headless-bench", "stories"] }
gpui = { package = "gpui-unofficial", version = "=1.17.0-pre", default-features = false }
gpui-web = { package = "gpui-web-gpui-unofficial", version = "=1.17.0-pre", default-features = false }
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.145"
wasm-bindgen = "=0.2.127"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element"] }
console_error_panic_hook = "0.1"
web-time = "1"
ulid.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
tokio = { version = "1.48.0", default-features = false, features = ["sync"] }
unicode-segmentation = "1.12"
markdown = "1.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
