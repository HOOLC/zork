[workspace]
members = [
  "crates/zork-browser-runtime",
  "crates/zork-browser",
  "crates/station",
  "crates/agent",
  "crates/agent-http",
  "crates/agent-server",
  "crates/agent-gateway-tools",
  "crates/agent-api",
  "crates/agent-testkit",
  "crates/profile",
  "crates/slack",
  "crates/zork-gh",
  "crates/zork-config",
  "crates/zork",
  "crates/zork-gui",
  "crates/zork-mesh",
  "crates/zork-notify",
  "crates/zork-observe",
  "crates/zork-gui-web",
  "crates/zork-ui",
  "crates/zork-client-core",
  "crates/zork-client-types",
  "crates/zork-android",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
imbl = "=7.0.1"
ulid = "1.2"
getrandom = { version = "0.3", features = ["std"] }
futures-util = { version = "0.3.31", features = ["channel"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["alloc", "derive", "rc"] }
tokio = { version = "1.48.0", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.dev.package.sha2]
opt-level = 3

# The desktop updater packages the dev profile. Optimize desktop rendering
# while leaving other workspace packages on the fast development profile.
[profile.dev.package.gpui-unofficial]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.zork-gui]
opt-level = 3

[profile.dev.package.zork-ui]
opt-level = 3

# The personal desktop build also runs image fitting on demand. Keep its
# resampling loops optimized, just like the GUI and tessellation hot paths.
[profile.dev.package.image]
opt-level = 3

# Syntax parsing runs when a new code block enters the viewport. The shipped
# dev-profile desktop needs the same optimized regex engine as its renderer.
[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.markdown]
opt-level = 2

[profile.dev.package.gpui-macos-gpui-unofficial]
opt-level = 2

[profile.dev.package.core-text]
opt-level = 2

[profile.dev.package.core-foundation]
opt-level = 2

# These collections and the Metal backend are on every GPUI layout/paint path.
[profile.dev.package.slotmap]
opt-level = 3

[profile.dev.package.smallvec]
opt-level = 3

[profile.dev.package.smol_str]
opt-level = 3

[profile.dev.package.rustc-hash]
opt-level = 3

[profile.dev.package.gpui-apple-gpui-unofficial]
opt-level = 3

# PathBuilder tessellation is part of the shipped dev-profile animation path.
[profile.dev.package.lyon_tessellation]
opt-level = 3

[profile.dev.package.lyon_path]
opt-level = 3

[profile.dev.package.lyon_geom]
opt-level = 3

[profile.dev.package.lyon_algorithms]
opt-level = 3
