[workspace]
members = [
  "crates/zork-browser-runtime",
  "crates/zork-browser",
  "crates/station",
  "crates/agent",
  "crates/agent-http",
  "crates/agent-server",
  "crates/agent-station-tools",
  "crates/agent-api",
  "crates/agent-testkit",
  "crates/profile",
  "crates/slack",
  "crates/zork-gh",
  "crates/zork-config",
  "crates/zork",
  "crates/zork-gui",
  "crates/zork-mesh",
  "crates/zork-notify",
  "crates/zork-observe",
  "crates/zork-gui-web",
  "crates/zork-ui",
  "crates/zork-liquid",
  "crates/zork-client-core",
  "crates/zork-client-types",
  "crates/zork-android",
]
exclude = ["vendor/iroh", "vendor/gpui-unofficial", "vendor/gpui-base-uo", "vendor/gpui-wgpu-gpui-unofficial", "vendor/gpui-apple-gpui-unofficial", "vendor/gpui-macos-gpui-unofficial", "vendor/gpui-web-gpui-unofficial", "vendor/rustls-platform-verifier"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
markdown = "1.0.0"
rusqlite = { version = "0.31", features = ["bundled", "hooks", "functions"] }
imbl = "=7.0.1"
ulid = "1.2"
getrandom = { version = "0.3", features = ["std"] }
futures-util = { version = "0.3.31", features = ["channel"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["alloc", "derive", "rc"] }
tokio = { version = "1.48.0", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

[profile.dev.package.sha2]
opt-level = 3

# The desktop updater packages the dev profile. Optimize desktop rendering
# while leaving other workspace packages on the fast development profile.
[profile.dev.package.gpui-unofficial]
opt-level = 3

# The Web gallery is interactive performance evidence, including in dev builds.
# Keep per-frame WebGL submission and font shaping out of debug code paths.
[profile.dev.package.gpui-web-gpui-unofficial]
opt-level = 3

[profile.dev.package.gpui-wgpu-gpui-unofficial]
opt-level = 3

[profile.dev.package.cosmic-text]
opt-level = 3

[profile.dev.package.harfrust]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.zork-gui]
opt-level = 3

[profile.dev.package.zork-ui]
opt-level = 3

[profile.dev.package.zork-liquid]
opt-level = 3

[profile.dev.package.gpui-base-uo]
opt-level = 3

[profile.dev.package.ropey]
opt-level = 3

# The personal desktop build also runs image fitting on demand. Keep its
# resampling loops optimized, just like the GUI and tessellation hot paths.
[profile.dev.package.image]
opt-level = 3

# Syntax parsing runs when a new code block enters the viewport. The shipped
# dev-profile desktop needs the same optimized regex engine as its renderer.
[profile.dev.package.syntect]
opt-level = 2

[profile.dev.package.fancy-regex]
opt-level = 2

[profile.dev.package.regex-automata]
opt-level = 2

[profile.dev.package.regex-syntax]
opt-level = 2

[profile.dev.package.markdown]
opt-level = 2

[profile.dev.package.gpui-macos-gpui-unofficial]
opt-level = 2

[profile.dev.package.core-text]
opt-level = 2

[profile.dev.package.core-foundation]
opt-level = 2

# These collections and the Metal backend are on every GPUI layout/paint path.
[profile.dev.package.slotmap]
opt-level = 3

[profile.dev.package.smallvec]
opt-level = 3

[profile.dev.package.smol_str]
opt-level = 3

[profile.dev.package.rustc-hash]
opt-level = 3

[profile.dev.package.gpui-apple-gpui-unofficial]
opt-level = 3

# PathBuilder tessellation is part of the shipped dev-profile animation path.
[profile.dev.package.lyon_tessellation]
opt-level = 3

[profile.dev.package.lyon_path]
opt-level = 3

[profile.dev.package.lyon_geom]
opt-level = 3

[profile.dev.package.lyon_algorithms]
opt-level = 3

# gpui-base's library does not use the profiler; enabling it transitively
# makes GPUI 1.17 action dispatch call std::time::Instant on wasm.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
rustls-platform-verifier = { path = "vendor/rustls-platform-verifier" }
gpui-unofficial = { path = "vendor/gpui-unofficial" }
gpui-base-uo = { path = "vendor/gpui-base-uo" }
gpui-wgpu-gpui-unofficial = { path = "vendor/gpui-wgpu-gpui-unofficial" }
gpui-apple-gpui-unofficial = { path = "vendor/gpui-apple-gpui-unofficial" }
gpui-macos-gpui-unofficial = { path = "vendor/gpui-macos-gpui-unofficial" }
gpui-web-gpui-unofficial = { path = "vendor/gpui-web-gpui-unofficial" }

[patch."https://github.com/AFK-surf/synchronicity.git"]
synch-engine = { path = "vendor/synch-engine" }
